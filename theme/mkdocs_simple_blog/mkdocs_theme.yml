language: de

include_search_page: true
# sitemap.xml with public URLs, robots.txt, llms.txt and llms-full.txt (plugin/seo.py)
static_templates:
  - sitemap.xml
  - robots.txt
  - llms.txt
  - llms-full.txt
search_index_only: false

sidebar: false
navigation_depth: 2
highlightjs: false
hljs_languages: []

# Scrolling ticker under the header: true (post titles), false, or a list of strings.
marquee: true
# Second line in the footer's first column.
footer_tagline: ""

# Search engines and LLMs. Keys set in mkdocs.yml (theme.seo.*) replace the
# Forti-Legends defaults in plugin/seo.py one by one; see README.
seo: {}

components:
  site_name: true
  title: true
  menu: true
  marquee: true
  preview: true
  footer: true
  page_dates: true
  blog_list: false
  blog_sidebar: false
blog:
  layout: compact
  cta_label: ""
  author: ""
  github: ""
  avatar: ""
  git_author: true
